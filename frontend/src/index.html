<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .task {
        margin-bottom: 0.75rem;
      }
      .task-completed .task-title {
        text-decoration: line-through;
        color: #6b7280;
      }
      .task-description {
        margin: 0.25rem 0 0;
        color: #374151;
      }
      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
