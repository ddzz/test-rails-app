<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .task {
        margin-bottom: 0.75rem;
      }
      .task-completed .task-title {
        text-decoration: line-through;
        color: #6b7280;
      }
      .task-description {
        margin: 0.25rem 0 0 1.6rem;
        color: #374151;
      }
      .site-nav {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .site-nav a {
        color: #374151;
      }
      .site-nav a.active {
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      .error {
        color: #b91c1c;
      }
      .errors {
        color: #b91c1c;
        margin: 0;
        padding-left: 1.25rem;
      }
      .task-form {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .task-form label {
        display: grid;
        gap: 0.25rem;
      }
      .task-form button {
        justify-self: start;
      }
      .task-list {
        list-style: none;
        padding: 0;
      }
      .task-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .task-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
